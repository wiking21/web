<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Wishlist</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --sun-pale: #f5d87a;
            --sun-bright: #f8c040;
            --sky-deep: #c43a1a;
            --sky-mid: #d45020;
            --water: #e06028;
            --silhouette: #3d120e;

            --card-bg: rgba(45, 15, 8, 0.72);
            --card-border: rgba(245, 216, 122, 0.35);

            --text-primary: #f8e8b0;
            --text-muted: rgba(232, 184, 120, 0.85);
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family: "DM Sans", sans-serif;
            color: var(--text-primary);

            background:
                radial-gradient(
                    ellipse at 50% 20%,
                    rgba(248, 192, 64, 0.25),
                    transparent 45%
                ),
                linear-gradient(
                    180deg,
                    var(--sky-mid),
                    var(--sky-deep)
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;

            overflow-x: hidden;
        }

        /* Dark vignette like the main website */
        body::before {
            content: "";
            position: fixed;
            inset: 0;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 35%,
                    rgba(30, 8, 4, 0.45) 100%
                ),
                linear-gradient(
                    to bottom,
                    rgba(30, 8, 4, 0.1),
                    transparent 40%,
                    rgba(30, 8, 4, 0.3)
                );
        }

        .wishlist-card {
            position: relative;
            z-index: 2;

            width: min(520px, 94vw);

            padding: 38px 30px 32px;

            background: var(--card-bg);

            border: 1px solid var(--card-border);
            border-radius: 24px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 0 0 1px rgba(245, 216, 122, 0.08),
                0 24px 80px rgba(30, 8, 4, 0.5),
                0 0 60px rgba(248, 192, 64, 0.06) inset;

            animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            text-align: center;
            margin-bottom: 8px;

            font-family: "Syne", sans-serif;
            font-size: clamp(2rem, 7vw, 3rem);
            font-weight: 800;

            color: var(--sun-pale);

            text-shadow:
                0 2px 16px rgba(61, 18, 14, 0.6);
        }

        .subtitle {
            text-align: center;

            margin-bottom: 28px;

            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .wishlist {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* The pill buttons */
        .wishlist-button {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            min-height: 62px;

            padding: 15px 24px;

            border-radius: 999px;

            border: 1px solid rgba(245, 216, 122, 0.35);

            background:
                linear-gradient(
                    135deg,
                    rgba(248, 192, 64, 0.13),
                    rgba(45, 15, 8, 0.45)
                );

            color: var(--text-primary);

            font-family: "DM Sans", sans-serif;
            font-size: 1rem;
            font-weight: 700;

            text-decoration: none;

            box-shadow:
                0 8px 25px rgba(30, 8, 4, 0.18);

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .wishlist-button:hover {
            transform: translateY(-2px) scale(1.015);

            border-color: rgba(245, 216, 122, 0.7);

            background:
                linear-gradient(
                    135deg,
                    rgba(248, 192, 64, 0.25),
                    rgba(45, 15, 8, 0.55)
                );

            box-shadow:
                0 12px 35px rgba(30, 8, 4, 0.3),
                0 0 25px rgba(248, 192, 64, 0.08);
        }

        .wishlist-button:active {
            transform: scale(0.98);
        }

        .back {
            display: block;

            margin-top: 24px;

            text-align: center;

            color: var(--text-muted);

            font-size: 0.85rem;
            text-decoration: none;

            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }

        .back:hover {
            color: var(--sun-pale);
            transform: translateX(-2px);
        }

        @media (max-width: 500px) {
            body {
                padding: 20px 14px;
            }

            .wishlist-card {
                padding: 30px 20px 25px;
                border-radius: 22px;
            }

            .wishlist-button {
                min-height: 58px;
            }
        }
    </style>
</head>

<body>

    <main class="wishlist-card">

        <h1 class="title">🎄 Wishlist</h1>

        <p class="subtitle">
            stuff I would love to get for Christmas :3
        </p>

        <div class="wishlist" id="wishlist"></div>

        <a class="back" href="index.html">
            ← back to my website
        </a>

    </main>

    <script>
        const WISHLIST_ITEMS = [
            {
                label: "📖 Gravity Falls Book",
                url: "https://books.disney.com/book/the-art-of-gravity-falls/"
            },
            {
                label: "🎸 Guitar",
                url: "https://www.amazon.de/Fender-Squier-Mini-Stratocaster-Dakota/dp/B085G462HT"
            }
        ];

        const wishlist = document.getElementById("wishlist");

        WISHLIST_ITEMS.forEach(item => {
            const button = document.createElement("a");

            button.className = "wishlist-button";
            button.href = item.url;
            button.target = "_blank";
            button.rel = "noopener noreferrer";
            button.textContent = item.label;

            wishlist.appendChild(button);
        });
    </script>

</body>
</html>
